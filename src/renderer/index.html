<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiraDo</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/markdown.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="highlight-theme">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body data-theme="dark">
  <div class="tab-bar">
    <div class="tabs" id="tabs-container"></div>
    <div class="tab-actions">
      <button class="tab-action" id="open-file-btn" title="Open File">
        <svg width="16" height="16" viewBox="0 0 16 16">
          <path fill="currentColor" d="M14 2H8.4L7 0.6C6.8 0.4 6.5 0.2 6.2 0.2H2C0.9 0.2 0 1.1 0 2.2v11.6c0 1.1 0.9 2 2 2h12c1.1 0 2-0.9 2-2V4c0-1.1-0.9-2-2-2z"/>
        </svg>
      </button>
      <button class="tab-action" id="theme-toggle-btn" title="Toggle Theme">
        <svg class="theme-icon sun" width="16" height="16" viewBox="0 0 16 16">
          <circle cx="8" cy="8" r="3" fill="currentColor"/>
          <line x1="8" y1="0" x2="8" y2="2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="8" y1="13.5" x2="8" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="16" y1="8" x2="13.5" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="2.5" y1="8" x2="0" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="13.5" y1="2.5" x2="11.8" y2="4.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="4.2" y1="11.8" x2="2.5" y2="13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="13.5" y1="13.5" x2="11.8" y2="11.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="4.2" y1="4.2" x2="2.5" y2="2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg class="theme-icon moon" width="16" height="16" viewBox="0 0 16 16" style="display: none;">
          <path fill="currentColor" d="M10 0.278a7.5 7.5 0 1 1-9.722 9.722A6.5 6.5 0 0 0 10 0.278z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="main-content">
    <button class="toc-toggle-collapsed" id="toc-toggle-btn" title="Show Table of Contents" style="display: none;">
      <svg width="16" height="16" viewBox="0 0 16 16">
        <rect x="0" y="2" width="16" height="2" rx="1" fill="currentColor"/>
        <rect x="0" y="7" width="16" height="2" rx="1" fill="currentColor"/>
        <rect x="0" y="12" width="16" height="2" rx="1" fill="currentColor"/>
      </svg>
    </button>

    <div class="toc-container" id="toc-container" style="display: none;">
      <div class="toc-header">
        <h3>Contents</h3>
        <button class="toc-close" id="toc-close-btn" title="Hide Table of Contents">
          <svg width="12" height="12" viewBox="0 0 12 12">
            <path d="M1 1 L11 11 M11 1 L1 11" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>
      <nav class="toc-nav" id="toc-nav"></nav>
    </div>

    <div class="content-area">
      <div class="home-screen" id="home-screen">
        <div class="home-content">
          <h1 class="app-title">MiraDo</h1>
          <p class="app-slogan">A minimalist Markdown viewer</p>
          <div class="recent-files" id="recent-files">
            <h2>Recent Files</h2>
            <div class="recent-files-list" id="recent-files-list"></div>
          </div>
        </div>
        <a href="https://github.com/h9812/mirado" class="github-link" target="_blank" title="View on GitHub">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
      </div>

      <div class="viewer-container" id="viewer-container" style="display: none;">
        <div class="markdown-body" id="markdown-content"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
